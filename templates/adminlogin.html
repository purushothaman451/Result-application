<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
     <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    
<!-- Admin Login Section -->
<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-slate-50">
    <div class="glass w-full max-w-[440px] p-6 sm:p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-white/30 transition-all duration-500">
        
        <!-- Icon & Header: Scaled for Mobile -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="bg-violet-600 w-14 h-14 sm:w-16 sm:h-16 rounded-[1.25rem] sm:rounded-3xl flex items-center justify-center shadow-lg shadow-violet-200 mx-auto mb-4">
                <i class="fas fa-user-lock text-white text-xl sm:text-2xl"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">Admin Portal</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-2 font-medium px-4">Please enter your credentials to continue</p>
        </div>

        <!-- Login Form -->
        <form action = "/admin" class="space-y-4 sm:space-y-5" method = "POST">
            <!-- Username Field -->
            <div class="group">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-widest group-focus-within:text-violet-600 transition-colors">Username</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-violet-500 transition-colors">
                        <i class="fas fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" placeholder="admin_username"
                        class="w-full bg-white border border-slate-200 rounded-2xl pl-11 sm:pl-12 pr-4 py-3 sm:py-3.5 text-sm focus:outline-none focus:ring-4 focus:ring-violet-500/10 focus:border-violet-500 transition-all placeholder:text-slate-300">
                </div>
            </div>

            <!-- Password Field -->
            <div class="group">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-2 tracking-widest group-focus-within:text-violet-600 transition-colors">Password</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-violet-500 transition-colors">
                        <i class="fas fa-key text-sm"></i>
                    </span>
                    <input type="password" name = "password" placeholder="••••••••" 
                        class="w-full bg-white border border-slate-200 rounded-2xl pl-11 sm:pl-12 pr-4 py-3 sm:py-3.5 text-sm focus:outline-none focus:ring-4 focus:ring-violet-500/10 focus:border-violet-500 transition-all placeholder:text-slate-300">
                </div>
            </div>

            <!-- Remember & Forgot: Optimized for Touch -->
            <div class="flex items-center justify-between px-1 pt-1">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-violet-600 focus:ring-violet-500 transition-all">
                    <span class="text-[11px] sm:text-xs text-slate-500 font-semibold group-hover:text-slate-700">Remember me</span>
                </label>
                <a href="#" class="text-[11px] sm:text-xs text-violet-600 font-bold hover:text-violet-700 transition-colors">Forgot Password?</a>
            </div>

            <!-- Submit Button: Full-width touch target -->
            <button type="submit" 
                class="w-full bg-slate-900 text-white py-3.5 sm:py-4 rounded-2xl font-bold text-sm hover:bg-violet-700 shadow-xl shadow-slate-200 transition-all active:scale-[0.97] mt-2">
                Authorize Access
            </button>
        </form>

        <!-- Security Footer: Compact on Mobile -->
        <div class="mt-6 sm:mt-8 pt-6 border-t border-slate-100 text-center">
            <div class="flex items-center justify-center gap-2 text-emerald-500 mb-4">
                <i class="fas fa-shield-halved text-[10px]"></i>
                <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-widest">Encrypted Secure Connection</span>
            </div>
            <p class="text-[9px] sm:text-[10px] text-slate-400 leading-relaxed max-w-[280px] mx-auto">
                Unauthorized access attempts are logged. <br class="hidden sm:block">
                Contact <a href="#" class="text-slate-500 font-bold hover:underline">IT Support</a> for help.
            </p>
        </div>
    </div>
</div>
</body>
</html>
