<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Univ GPA & CGPA Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for the table to look cleaner on desktop */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-900">
    
    <nav class="bg-white border-b sticky top-0 z-50 px-4 md:px-6 py-3 flex justify-between items-center shadow-sm w-full">
        <div class="flex items-center gap-3 md:gap-4">
            <div class="bg-blue-600 h-10 w-10 md:h-12 md:w-12 rounded-xl flex items-center justify-center overflow-hidden flex-shrink-0 shadow-inner p-1.5">
                <img src="/static/img/adhi.logo.png" alt="university logo" class="max-h-full max-w-full object-contain">
            </div>
            <div class="flex flex-col justify-center">
                <span class="text-[15px] md:text-xl font-extrabold tracking-tight text-blue-900 leading-none">ADHI STUDENT HUB</span>
                <span class="text-[10px] md:text-xs text-slate-500 font-bold uppercase mt-0.5 tracking-wider">Portal v3.0</span>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <a href="/" class="hidden sm:block bg-slate-100 text-slate-700 px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-200 transition-all active:scale-95">Home</a>
            <a href="/logout" class="bg-slate-900 text-white px-4 py-2 md:px-5 md:py-2 rounded-xl font-bold text-sm hover:bg-red-600 shadow-md transition-all active:scale-95">Logout</a>
        </div>
    </nav>

    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 flex-grow">
        
        <div class="mb-6 md:mb-8 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Class Timetable</h1>
            <p class="text-sm md:text-base text-gray-500 mt-2">Select your department and year to view your weekly schedule.</p>
        </div>

        <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <form action="#" method="GET" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 items-end">
                
                <div class="w-full">
                    <label for="department" class="block text-sm font-semibold text-gray-700 mb-1.5">Department</label>
                    <select id="department" name="department" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 md:py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 hover:bg-white transition-colors cursor-pointer appearance-none">
                        <option value="" disabled selected>Select Department...</option>
                        <option value="cs">Computer Science Engineering (CSE)</option>
                        <option value="ee">Electrical and Electronics Engineering (EEE)</option>
                        <option value="me">Mechanical Engineering (MECH)</option>
                        <option value="ce">Electrical and Communication Engineering (ECE)</option>
                        <option value="ce">Aritificial Intelligence and Data Science (AI&DS)</option>
                        <option value="ce">Information Technology (IT)</option>
                    </select>
                </div>

                <div class="w-full">
                    <label for="year" class="block text-sm font-semibold text-gray-700 mb-1.5">Year</label>
                    <select id="year" name="year" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 md:py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 hover:bg-white transition-colors cursor-pointer appearance-none">
                        <option value="" disabled selected>Select Year...</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div class="w-full sm:col-span-2 lg:col-span-1 mt-2 sm:mt-0">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 md:py-3 px-4 rounded-lg shadow-sm transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-calendar-days"></i>
                        View Timetable
                    </button>
                </div>
            </form>
        </div>


        

    </main>
</body>
</html>
